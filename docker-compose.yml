# ============================================================================
# 🐳 FinanceRAG Docker Compose Configuration
# ============================================================================
# Usage:
#   - CPU only:  docker-compose up
#   - With GPU:  docker-compose -f docker-compose.yml -f docker-compose.gpu.yml up

version: '3.8'

services:
  financerag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financerag-notebook
    
    # Port mapping
    ports:
      - "8888:8888"  # Jupyter Lab
    
    # Volume mounts
    volumes:
      - .:/workspace  # Project files
      - financerag-cache:/root/.cache  # Hugging Face cache
      - financerag-data:/workspace/data  # Data persistence
      - financerag-output:/workspace/output  # Output persistence
    
    # Environment variables
    environment:
      - PYTHONPATH=/workspace
      - TRANSFORMERS_CACHE=/root/.cache/huggingface
      - HF_HOME=/root/.cache/huggingface
      - TORCH_HOME=/root/.cache/torch
    
    # Working directory
    working_dir: /workspace
    
    # Resource limits (adjust based on your system)
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    
    # Keep container running
    restart: unless-stopped
    
    # Default command
    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --NotebookApp.token=''
      --NotebookApp.password=''

  # --------------------------------------------------------------------------
  # 💹 Streamlit app: Retrieve -> Rerank -> Generate interface
  # Usage:  docker-compose up -d app   ->  http://localhost:8501
  # --------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: financerag-app
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data:ro            # corpora / queries / qrels
      - ./models:/app/models:ro        # fine-tuned embedding model (optional)
      - financerag-cache:/root/.cache  # Hugging Face model cache
      - financerag-ragcache:/app/.rag_cache  # built FAISS/BM25 indexes
    environment:
      - PYTHONPATH=/app
      - HF_HOME=/root/.cache/huggingface
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}   # set in your shell or .env to enable answers
      - FINRAG_LLM_MODEL=${FINRAG_LLM_MODEL:-gpt-4o-mini}
    restart: unless-stopped

volumes:
  financerag-cache:
    driver: local
  financerag-data:
    driver: local
  financerag-output:
    driver: local
  financerag-ragcache:
    driver: local
